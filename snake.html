<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Arcade | RetroHub</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fuente retro solo para el marcador/títulos del juego -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Tus estilos globales -->
    <link rel="stylesheet" href="styles.css">
    <!-- Estilos específicos de Snake -->
    <link rel="stylesheet" href="snakestyle.css">
</head>

<body class="page-game2">

    <!-- Navegación superior coherente con index.html -->
    <nav class="navbar navbar-expand-lg arcade-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span>🕹️</span> RETRO<span class="brand-accent">ARCADE</span>
            </a>
            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="game1.html">Neon Rush</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="snake.html">Snake</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4 flex-grow-1 d-flex flex-column align-items-center justify-content-center">

        <!-- Encabezado del juego -->
        <div class="text-center mb-3">
            <span class="hero-badge mb-2">Clásico Retro</span>
            <h1 class="hero-title h2 mb-1">
                CYBER <span class="text-gradient-home">SNAKE</span>
            </h1>
            <p class="text-muted-custom small mb-0">
                Usa <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> o las <kbd>Flechas</kbd> para moverte
            </p>
        </div>

        <!-- Contenedor del Juego (Estilo Game Card) -->
        <div id="app" class="app snake-wrapper">

            <!-- Barra superior de estado dentro de la cabina -->
            <div class="snake-hud">
                <div class="d-flex align-items-center gap-2">
                    <span class="status-dot"></span>
                    <span class="text-muted-custom small fw-semibold">MODO: <strong id="hud-mode"
                            class="text-white">EASY</strong></span>
                </div>
                <div class="score-box">
                    PUNTOS: <span class="score">0</span>
                </div>
            </div>

            <!-- Área de juego (Canvas + Pantalla de Inicio/Game Over) -->
            <div class="canvas-container">
                <div class="start-screen animated bounceIn">
                    <div class="snake-icon mb-2">🐍</div>
                    <h2 id="screen-title">SNAKE</h2>
                    <p class="end-score d-none"></p>

                    <div class="options my-3">
                        <p class="text-muted-custom small text-uppercase fw-bold mb-2">Selecciona Dificultad</p>
                        <div class="d-flex justify-content-center gap-2">
                            <button type="button" data-difficulty="90" data-label="EASY"
                                class="btn-diff active">Easy</button>
                            <button type="button" data-difficulty="60" data-label="MEDIUM"
                                class="btn-diff">Medium</button>
                            <button type="button" data-difficulty="35" data-label="HARD" class="btn-diff">Hard</button>
                        </div>
                    </div>

                    <button type="button" class="play-btn w-100 mt-2">JUGAR AHORA</button>
                </div>

                <canvas id="snakeCanvas" width="600" height="440"></canvas>
            </div>

        </div>
    </main>

    <!-- Footer coherente -->
    <footer class="py-3 text-center text-muted-custom small">
        <div class="container">
            <span>RetroArcade © 2026 — Todos los derechos reservados</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="snakelogic.js"></script>
</body>

</html>
